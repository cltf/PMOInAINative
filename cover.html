<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>封面 · AI组织项目管理升级</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #eceae6;
      font-family: "Noto Sans SC", system-ui, sans-serif;
      color: #0f1c2e;
    }
    .stage { width: min(420px, 100%); }
    .cover {
      width: 100%;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(15,28,46,0.18);
      line-height: 0;
      background: #fff;
    }
    .cover img { width: 100%; height: auto; display: block; }
    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .actions a {
      color: #6b7a8d;
      font-size: 0.9rem;
      text-decoration: none;
    }
    .actions a:hover { color: #0f1c2e; }
    .meta {
      text-align: center;
      margin-top: 0.85rem;
      color: #6b7a8d;
      font-size: 0.92rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="cover">
      <img src="images/cover.jpg" alt="AI组织项目管理升级 封面" />
    </div>
    <div class="meta">
      AI组织项目管理升级<br />
      赵登琴 著<br />
      希望学产研团队项目经理专家 · 清华大学本科
    </div>
    <div class="actions">
      <a href="index.html">进入目录</a>
      <a href="ch01.html">开始第 1 章</a>
    </div>
  </div>
</body>
</html>
